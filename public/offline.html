<!doctype html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Offline · Pausa</title>
    <style>
        :root { --paper: #f1f4f2; --ink: #1f2a27; --muted: #64736d; --accent: #376e5d; --on-accent: #fff; }
        @media (prefers-color-scheme: dark) { :root { --paper: #131917; --ink: #e3ebe7; --muted: #93a39c; --accent: #86c4b0; --on-accent: #0f1a16; } }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--paper); color: var(--ink);
               font: 400 1rem/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
        h1 { margin: 16px 0 8px; font: 800 2rem/1.1 ui-rounded, "SF Pro Rounded", system-ui, sans-serif; letter-spacing: -0.02em; }
        p { margin: 0 0 24px; color: var(--muted); }
        button { padding: 12px 22px; border: 0; border-radius: 999px; background: var(--accent); color: var(--on-accent); font: 600 1rem system-ui, sans-serif; cursor: pointer; }
    </style>
</head>
<body>
<main>
    <img src="assets/icons/icon-192.png" width="72" height="72" alt="">
    <h1>Sei offline</h1>
    <p>Per vedere e prenotare le pause serve la connessione.</p>
    <button type="button" onclick="location.reload()">Riprova</button>
</main>
</body>
</html>
